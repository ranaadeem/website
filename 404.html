<style>
:root{--navy:#1a3a8a;--gold:#c9a84c;--cream:#faf8f4;--text:#1a1a2e;--muted:#6b7280;}
@media (prefers-color-scheme: dark) {
  :root {
    --navy: #93bbf0;
    --gold: #d4aa4a;
    --gold-light: #c9a84c;
    --cream: #1a1d2e;
    --white: #242840;
    --text: #e8eaf0;
    --muted: #8b93a8;
    --border: #353b5a;
  }
  body { background: var(--cream) !important; color: var(--text) !important; }
  #main-nav { background: #1a2a5e !important; border-bottom-color: var(--gold) !important; }
  .nav-logo-agr { color: var(--gold) !important; border-color: var(--gold) !important; }
  .nav-cta { background: var(--gold) !important; color: #1a1a2e !important; }
  .nav-link { color: rgba(220,230,255,0.85) !important; }
  input, select, textarea { background: #242840 !important; color: var(--text) !important; border-color: var(--border) !important; }
  a { color: var(--gold); }
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--navy);color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}
.error-code{font-family:"Playfair Display",serif;font-size:clamp(6rem,20vw,12rem);color:var(--gold);line-height:1;opacity:0.15;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;user-select:none;}
.content{position:relative;z-index:1;max-width:480px;}
.molecule{font-size:4rem;margin-bottom:1.5rem;animation:spin 8s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
h1{font-family:"Playfair Display",serif;font-size:clamp(1.4rem,4vw,2rem);color:white;margin-bottom:0.75rem;}
p{font-size:15px;color:rgba(255,255,255,0.65);line-height:1.7;margin-bottom:2rem;}
.links{display:flex;flex-wrap:wrap;gap:0.75rem;justify-content:center;}
.btn-primary{background:var(--gold);color:var(--navy);padding:11px 24px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;transition:opacity 0.2s;}
.btn-primary:hover{opacity:0.9;}
.btn-secondary{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8);padding:11px 24px;border-radius:8px;text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,0.15);transition:all 0.2s;}
.btn-secondary:hover{background:rgba(255,255,255,0.15);}
.nav-strip{position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(201,168,76,0.2);}
.nav-logo{font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--gold);letter-spacing:2px;border:2px solid var(--gold);padding:2px 8px;border-radius:4px;text-decoration:none;}
.nav-home{font-size:13px;color:rgba(255,255,255,0.7);text-decoration:none;}
.nav-home:hover{color:var(--gold);}
</style>
