<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Post — Dr. Adeem Ghaffar Rana</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Dr. Adeem Ghaffar Rana">
<style>
:root{--navy:#1a3a8a;--gold:#c9a84c;--gold-light:#e8d5a3;--cream:#faf8f4;--white:#fff;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;}
*{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:hidden;background:var(--cream);}
body{font-family:"DM Sans",sans-serif;background:var(--cream);color:var(--text);}
#main-nav{position:sticky;top:0;z-index:1000;background:var(--navy);border-bottom:2px solid var(--gold);box-shadow:0 2px 20px rgba(0,0,0,0.3);}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:64px;}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;}
.nav-logo-agr{font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--gold);letter-spacing:2px;border:2px solid var(--gold);padding:2px 8px;border-radius:4px;}
.nav-logo-name{font-size:13px;color:rgba(255,255,255,0.75);}
.nav-links{display:flex;align-items:center;gap:0.25rem;list-style:none;}
.nav-link{color:rgba(255,255,255,0.75);text-decoration:none;font-size:13px;padding:8px 12px;border-radius:6px;transition:all 0.2s;}
.nav-link:hover,.nav-link.active{color:var(--gold);background:rgba(201,168,76,0.1);}
.nav-cta{background:var(--gold);color:var(--navy)!important;text-decoration:none;font-size:13px;font-weight:600;padding:8px 16px;border-radius:6px;margin-left:8px;}
.nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;}
.nav-hamburger span{display:block;width:24px;height:2px;background:var(--gold);border-radius:2px;}
.nav-dropdown{position:relative;}
.nav-dropdown > .nav-link::after{content:' ▾';font-size:9px;opacity:0.7;}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% - 2px);left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid rgba(201,168,76,0.25);border-radius:10px;padding:0.4rem;min-width:180px;list-style:none;box-shadow:0 8px 30px rgba(0,0,0,0.35);z-index:2000;}
.nav-dropdown-menu::after{content:"";position:absolute;top:-10px;left:0;right:0;height:10px;}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown.open .nav-dropdown-menu{display:block;}
.nav-dropdown-item{display:block;padding:9px 16px;color:rgba(255,255,255,0.85);text-decoration:none;font-size:13px;border-radius:6px;transition:all 0.15s;white-space:nowrap;}
.nav-dropdown-item:hover{background:rgba(201,168,76,0.15);color:var(--gold);}
@media(max-width:768px){
  .nav-logo-name{display:none;}.nav-hamburger{display:flex;}
  .nav-links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--navy);flex-direction:column;padding:1rem;border-bottom:2px solid var(--gold);z-index:999;}
  .nav-links.open{display:flex;}.nav-link{width:100%;padding:12px 16px;}
  .nav-cta{width:100%;text-align:center;margin-left:0;margin-top:0.5rem;}
  .nav-dropdown-menu{position:static;transform:none;box-shadow:none;border:none;background:rgba(255,255,255,0.05);padding:0 0 0 1rem;}
  .nav-dropdown:hover .nav-dropdown-menu{display:none;}.nav-dropdown.open .nav-dropdown-menu{display:block;}
  .nav-dropdown-item{padding:8px 12px;color:rgba(255,255,255,0.7);}
}

/* POST */
.post-wrap{max-width:720px;margin:0 auto;padding:3rem 2rem 5rem;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--gold);text-decoration:none;font-size:13px;margin-bottom:2rem;}
.back-link:hover{opacity:0.8;}
.post-cover{width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin-bottom:2rem;display:block;}
.post-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem;}
.post-tag{background:rgba(26,58,138,0.07);color:var(--navy);font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500;}
.post-title{font-family:"Playfair Display",serif;font-size:clamp(1.6rem,4vw,2.2rem);color:var(--navy);line-height:1.25;margin-bottom:0.5rem;}
.post-subtitle{font-size:1.05rem;color:var(--muted);margin-bottom:1.25rem;line-height:1.5;}
.post-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:0.5rem;flex-wrap:wrap;}
.post-author{font-weight:600;color:var(--text);}
.post-author-bio{font-size:12px;color:var(--muted);margin-bottom:2rem;}
.post-divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0 2rem;}
/* Content styles */
.post-content{font-size:15px;line-height:1.85;color:var(--text);}
.post-content h1,.post-content h2,.post-content h3{font-family:"Playfair Display",serif;color:var(--navy);margin:1.75rem 0 0.75rem;line-height:1.3;}
.post-content h1{font-size:1.6rem;}
.post-content h2{font-size:1.3rem;}
.post-content h3{font-size:1.1rem;}
.post-content p{margin-bottom:1.1rem;}
.post-content strong{color:var(--navy);}
.post-content em{font-style:italic;}
.post-content a{color:var(--navy);text-decoration:underline;}
.post-content a:hover{color:var(--gold);}
.post-content ul,.post-content ol{padding-left:1.5rem;margin-bottom:1.1rem;}
.post-content li{margin-bottom:0.4rem;}
.post-content blockquote{border-left:3px solid var(--gold);background:rgba(201,168,76,0.06);padding:0.75rem 1.25rem;margin:1.25rem 0;border-radius:0 8px 8px 0;font-style:italic;}
.post-content img{max-width:100%;border-radius:8px;margin:1rem 0;}
.post-content pre{background:#f3f4f6;padding:1rem;border-radius:8px;overflow-x:auto;font-size:13px;margin-bottom:1rem;}

/* Loading / error */
.loading-state{text-align:center;padding:4rem 2rem;color:var(--muted);}
.loading-state-icon{font-size:3rem;margin-bottom:1rem;}
</style>
</head>
<body>

<nav id="main-nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <span class="nav-logo-agr">AGR</span>
      <span class="nav-logo-name">Dr. Adeem Ghaffar Rana</span>
    </a>
    <button class="nav-hamburger" id="nav-hamburger"><span></span><span></span><span></span></button>
    <ul class="nav-links" id="nav-links">
      <li><a href="/" class="nav-link">Home</a></li>
      <li><a href="/about.html" class="nav-link">About</a></li>
      <li class="nav-dropdown">
        <a href="/research.html" class="nav-link nav-dropdown-trigger">Research</a>
        <ul class="nav-dropdown-menu">
          <li><a href="/research.html" class="nav-dropdown-item">📄 Publications</a></li>
          <li><a href="/teaching.html" class="nav-dropdown-item">🎓 Teaching</a></li>
          <li><a href="/cv.html" class="nav-dropdown-item">📋 CV</a></li>
        </ul>
      </li>
      <li class="nav-dropdown">
        <a href="/blog.html" class="nav-link active nav-dropdown-trigger">Blog</a>
        <ul class="nav-dropdown-menu">
          <li><a href="/blog.html" class="nav-dropdown-item">✍️ Blog Posts</a></li>
          <li><a href="/photography.html" class="nav-dropdown-item">📷 Photography</a></li>
        </ul>
      </li>
      <li class="nav-dropdown">
        <a href="/alumni.html" class="nav-link nav-dropdown-trigger">Alumni</a>
        <ul class="nav-dropdown-menu">
          <li><a href="/session2006.html" class="nav-dropdown-item">🎓 Session 2006</a></li>
          <li><a href="/alumni.html" class="nav-dropdown-item">👥 Alumni Portal</a></li>
        </ul>
      </li>
      <li><a href="mailto:ranaadeem@hotmail.com" class="nav-cta">Contact</a></li>
    </ul>
  </div>
</nav>

<div class="post-wrap">
  <a href="/blog.html" class="back-link">← Back to Blog</a>
  <div id="post-content-area">
    <div class="loading-state">
      <div class="loading-state-icon">📄</div>
      <p>Loading post...</p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

const app = initializeApp({apiKey:"AIzaSyAgUl22Cln6QtY3-HIvI6lE8Zu7n9OblbI",authDomain:"icet-alumni.firebaseapp.com",projectId:"icet-alumni",storageBucket:"icet-alumni.firebasestorage.app",messagingSenderId:"707390888790",appId:"1:707390888790:web:57e6be62e4d11e22c214f7"});
const db = getFirestore(app);

async function loadPost() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const area = document.getElementById('post-content-area');

  if (!id) {
    area.innerHTML = '<div class="loading-state"><div class="loading-state-icon">❌</div><p>No post ID provided.</p></div>';
    return;
  }

  try {
    const snap = await getDoc(doc(db, 'posts', id));
    if (!snap.exists() || snap.data().status !== 'published') {
      area.innerHTML = '<div class="loading-state"><div class="loading-state-icon">🔍</div><p>Post not found.</p></div>';
      return;
    }

    const p = snap.data();
    const date = p.publishedAt ? new Date(p.publishedAt.seconds*1000).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : '';
    const tags = (p.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
    const tagsHtml = tags.map(t=>`<span class="post-tag">${t}</span>`).join('');

    // Update page title and OG
    document.getElementById('page-title').textContent = p.title + ' — Dr. Adeem Ghaffar Rana';
    document.title = p.title + ' — Dr. Adeem Ghaffar Rana';

    area.innerHTML = `
      ${p.coverImage ? `<img class="post-cover" src="${p.coverImage}" alt="${p.title}">` : ''}
      ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
      <h1 class="post-title">${p.title}</h1>
      ${p.subtitle ? `<p class="post-subtitle">${p.subtitle}</p>` : ''}
      <div class="post-meta">
        <span class="post-author">${p.authorName || 'Dr. Adeem Ghaffar Rana'}</span>
        ${date ? `<span>·</span><span>${date}</span>` : ''}
      </div>
      ${p.authorBio ? `<p class="post-author-bio">${p.authorBio}</p>` : ''}
      <hr class="post-divider">
      <div class="post-content">${p.content}</div>
    `;
  } catch(e) {
    area.innerHTML = '<div class="loading-state"><div class="loading-state-icon">⚠️</div><p>Error loading post.</p></div>';
    console.error(e);
  }
}

loadPost();
</script>

<script>
document.getElementById('nav-hamburger').addEventListener('click', function() {
  document.getElementById('nav-links').classList.toggle('open');
});
document.querySelectorAll('.nav-dropdown-trigger').forEach(function(trigger) {
  trigger.addEventListener('click', function(e) {
    if (window.innerWidth <= 768) { e.preventDefault(); this.closest('.nav-dropdown').classList.toggle('open'); }
  });
});
document.addEventListener('click', function(e) {
  if (!e.target.closest('.nav-dropdown')) document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
});
</script>
</body>
</html>
